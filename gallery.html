<!-- Image Popup Modal -->
<div class="modal fade" id="popupModal" tabindex="-1" aria-hidden="true">

      <!-- Prev / Next -->

      <button class="nav-btn next-btn" id="nextBtn">&#8250;</button>
      <div class="modal-body p-0">

      </div>

<!-- Bootstrap + Custom Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
  const images = Array.from(document.querySelectorAll('.img-popup'));
  let currentIndex = -1;
  const popupModal = new bootstrap.Modal(document.getElementById('popupModal'));
  const popupImage = document.getElementById('popupImage');

  function showImage(index) {
    if (index >= 0 && index < images.length) {
      currentIndex = index;
      const src = images[currentIndex].getAttribute('data-bs-image');
      popupImage.src = src;
      popupModal.show();
    }
  }

  images.forEach((img, index) => {
    img.addEventListener('click', () => showImage(index));
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentIndex > 0) {
      showImage(currentIndex - 1);
    }
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentIndex < images.length - 1) {
      showImage(currentIndex + 1);
    }
  });

  // Keyboard navigation support
  document.addEventListener('keydown', function (e) {
    if (document.getElementById('popupModal').classList.contains('show')) {
      if (e.key === 'ArrowLeft') {
        document.getElementById('prevBtn').click();
      } else if (e.key === 'ArrowRight') {
        document.getElementById('nextBtn').click();
      } else if (e.key === 'Escape') {
        popupModal.hide();
      }
    }
  });
</script>
